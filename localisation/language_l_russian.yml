l_russian:
    
   language.1.t:0 "Выбор языка"
   language.1.d:0 "Здесь вы можете выбрать язык, в котором вы хотите увидеть Европу. Имейте в виду, что это не изменит язык игры, а скорее города на карте.Динамический язык также будет реализован позже."
   language.1.a:0 "Родные имена - каждый город на своем языке - по умолчанию"
   language.1.b:0 "Английский"
   language.1.c:0 "Немецкий"
   language.1.e:0 "турецкий"
   
   language.2.t:0 "Английские названия города"
   language.2.d:0 "Городские названия будут переведены на английский.Не во всех городах есть английские имена, небольшие поселения и места, в которых отсутствует альтернативное название на английском языке, не будут переведены.(Могут быть противоречивые изменения)"
   language.2.a:0 "Перевести это."
   
   language.3.t:0 "Городские названия на немецком языке"
   language.3.d:0 "Названия города переведены на немецкий.Не все города переводятся, потому что не все свои собственные имена имеют на немецком языке.Большинство небольших поселений и мест без уникальных имен на немецком языке не обрабатываются.(Могут быть спорные альтернативы)"
   language.3.a:0 "Германизировали города!"
   
   language.4.t:0 "Турецкие имена города"
   language.4.d:0 "Городские названия будут переведены на турецкий.Поскольку в каждом городе нет турецкого имени, обычно небольшие регионы и города без прямых турецких особых имен не будут переведены.(Могут быть противоречивые переводы)"
   language.4.a:0 "Токийский Дрифт."
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   
   