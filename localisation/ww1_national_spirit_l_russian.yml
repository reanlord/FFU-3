 #--------------------------------------------------------------
 AUH_ww1_Multinational_State:0 "Многонациональное состояние"
 AUH_ww1_Multinational_State_desc:0 «В отличие от большинства стран этого периода, австро-венгерская империя не является национально организованным государством, а переживлением старых браков и наследства трона, которые дали Империи культурное лоскутное одеяло территории. В последнее время многие изПредмет национальности Империи начал стремление к независимости, нанося ущерб австрийскому государству ».
 #--------------------------------------------------------------
 ITA_ww1_Risorgimento:0 "Risorgimento "
 ITA_ww1_Risorgimento_desc:0 "Risorgimento (также известный как итальянское объединение) был политическим и социальным движением, которое объединило различные государства итальянского полуострова в единственное состояние Царства Италии.Память об этом событии, а также последовавшее за нравиризмом является движущей силой как в итальянском единстве, так и в политике ».
 #--------------------------------------------------------------
 ww1_Faith_Allah:0 "Вера в Аллах "
 ww1_Faith_Allah_desc:0 "В Коране Аллах приказывает верующим объединить, присоединяться к рядам в вере, рассматривать и любить друг друга как братьев, быть прощающим и защищать, и решительно избегать фрагментации, разделения и рассеяния.Османская гегемония в Мекке, а также титул султана как ислам халифа, доказывает веру их правительства ».
 #--------------------------------------------------------------
 ww1_Scramble_for_Africa:0 "Схватка за Африку "
 ww1_Scramble_for_Africa_desc:0 "Соперничество между Великобританией, Францией, Германией и другими европейскими державами составляет большую часть напряженности между великими державами в эту эпоху.С оставленными только фрагментами территории, требования аннексии иностранных колоний уже начинают эхо на наших улицах ».
 #--------------------------------------------------------------
 AUH_ww1_House_Habsburg_Lorraine:0 "Дом Габсбург-Лоррингии "
 AUH_ww1_House_Habsburg_Lorraine_desc:0 "Дом Габсбург-Лорена-один из самых влиятельных королевских домов Европы и правящей династии Австрии-Венгрии.Длинное наследие этой семьи на престоле Империи дает им большую часть необходимой легитимности, чтобы сохранить их правление, если они могут его поддерживать ».
 #--------------------------------------------------------------
 GER_ww1_North_German_Confederation:0 "Наследие конфедерации Северной Германии "
 GER_ww1_North_German_Confederation_desc:0 "После многих лет того, что он был второстепенным игроком в немецкой сфере, Пруссия сформировала Северную Германии Конфедерацию, установив себя как главную власть в Германии, прежде чем, наконец, объединить империю.С этим событием, все еще в живой памяти, законы и гордость нашего народа все еще отражают это монументальное событие ».
 #--------------------------------------------------------------
 German_staff_ww1:0 "Немецкий персонал "
 German_staff_ww1_desc:0 "Немецкая армия, ответственная за непрерывное изучение всех аспектов войны, и за составление и рассмотрение планов мобилизации или кампании.Он существовал неофициально с 1806 года и был официально создан в 1814 году в 1814 году, первым существующим штатом.Это отличалось официальным отбором своих офицеров разведыванием и доказанной заслугой, а не патронажем или богатством, а также исчерпывающим и строго структурированным обучением, которое его сотрудники сотрудников прошли.Его рост и развитие дали немецким вооруженным силам решающее стратегическое преимущество перед своими противниками в течение почти полутора веков ».

 Austrian_staff:0 "Австрийский персонал "
 Austrian_staff_desc:0 "Имперский и королевский генеральный штат Австрии-Венгрии был частью министерства войны.Он возглавлял начальник Генерального штаба для целых вооруженных сил, которые имели прямой доступ к императору.Генеральный персонал отвечал за планирование и подготовку, в то время как Armeeoberkommando (AOK) был оперативным высоким командованием.Фактически, поскольку AOK находился под прямым командованием императора, а руководитель генерального штаба был его главным советником, на практике AOK находился под контролем начальника Генерального штаба ».

 Franch_Staff:0 "Французский персонал "
 Franch_Staff_desc:0 "Во времена войны начальник штаба армии взял на себя ответственность за общую штаб -квартиру. Во время Первой мировой войны лидер французских армий по-разному назвал верховным генералом (Generalissimo) или главнокомандующим.В последние годы войны создание Верховного военного совета в 1917 году привело к тому, что общее командование было проведено французским генералом Фердинандом Фохом, и к середине 1918 года начальник французской армии Пеин был подчинен Фош.Хотя война, по сути, закончилась перемирием в ноябре 1918 года, организация военного времени сохранялась до 1920 года ».

 ENG_Staff:0 "Английский персонал "
 ENG_Staff_desc:0 "Британская армия во время Первой мировой войны могла проследить свою организацию до растущих требований имперской экспансии.Структура была добровольной системой набора и полковой системы, которая была определена реформами Cardwell и Childers конца 19 -го века.Британская армия была подготовлена и в первую очередь призван к вопросам империи и последующих колониальных войн. [4]В последние годы 19 -го века армия была вовлечена в крупный конфликт, вторую бурскую войну (1899–1902), в которой подчеркивались недостатки в ее тактике, лидерстве и администрации."

