 # [Holland] Political Effort
 #=========================================================================
 HOL_political_effort:0 "Политические усилия"
 HOL_political_effort_desc:0 "Время реформы сейчас.Хотя нация была в порядке под руководством системы старой в течение многих лет, эти бурные времена требуют правительства, которое может ответить на них.Решаем ли мы изменить наши пути в качестве нации или укрепить наше существующее правительство противостоять новым внешним угрозам, политические изменения не могут принести ничего, кроме как принести пользу нашей нации и будущему народа."
 HOL_Reform:0 "Реформа"
 HOL_Reform_desc:0 "Реформировать правительство Голландии в пользу более коммунистического"
 HOL_Preserve:0 "Сохранять"
 HOL_Preserve_desc:0 " Сохранить старые права и стандарты"
 HOL_Reform_2:0 "Вторая реформа"
 HOL_Reform_2_desc:0 "Еще одна реформа, которая дает коммунистическую партию"
 HOL_Settle_religious_conflict:0 "Установите религиозные конфликты"
 HOL_Settle_religious_conflict_desc:0 "Установите религиозный конфликт между протестантами и католиками"
 HOL_End_census_kies:0 "Право на голосование в конце переписи"
 HOL_End_census_kies_desc:0 "Теперь, наконец, все люди могут голосовать, а не только богатые."
 HOL_Let_them_eat_potatoes:0 "Позвольте им съесть картофель!"
 HOL_Let_them_eat_potatoes_desc:0 "Добро пожаловать в картофельную революцию!"
 HOL_Troelstra_reforms:0 "Реформы Троэльстра"
 HOL_Troelstra_reforms_decs:0 "Троэльстра отменяет каждую политическую партию и подразделяет голландские народы"
 HOL_Capitalist_ideas:0 "Капиталистические идеи"
 HOL_Capitalist_ideas_desc:0 "Принять более капиталистические идеи, но все же сохраняют некоторые социальные элементы."
 HOL_neutrality_focus1:0 "Нейтралитет "
 HOL_neutrality_focus1_desc:0 "Мы решили остаться в стороне от вооруженного конфликта за пределами наших границ."
 HOL_End_census_neu:0 "Право на голосование в конце переписи"
 HOL_End_census_neu_desc:0 "Теперь, наконец, все люди могут голосовать, а не только богатые."
 HOL_Reinforce_border:0 "Подкреплять границу"
 HOL_Reinforce_border_desc:0 "В случае войны мы должны быть готовы"
 HOL_Colony_effort:0 "Колония усилия"
 HOL_Colony_effort_desc:0 "Мы не можем просто пренебрегать колониями в этих усилиях, чтобы улучшить нашу страну!"
 HOL_God_save_the_queen:0 "Боже, храни королеву!"
 HOL_God_save_the_queen_desc:0 "Наша королева - наша страна, мы хотим служить ей и под ней."
 HOL_Netherland_first:0 "Нидерланды в первую очередь"
 HOL_Netherland_first_desc:0 "Мы больше всего объединяем нашу страну"
 HOL_Fight_2_live:0 "Бороться, чтобы жить в другой день"
 HOL_Fight_2_live_desc:0 "Нам нужно принять меры на случай, если все усилится."
 HOL_Live_2_Fight:0 "Живи, чтобы сражаться в другой день"
 HOL_Live_2_Fight_desc:0 "Защита - самая важная вещь."
 HOL_democratic_focus:0 "Свобода"
 HOL_democratic_focus_desc:0 "Пришло время расширить наши политические взгляды и присоединиться к действительно свободным народам мира"
 HOL_One_for_all:0 "Один за всех!"
 HOL_One_for_all_desc:0 "Нам нужно служить армии, чтобы защитить страну!"
 HOL_More_men:0 "И все для одного!"
 HOL_More_men_desc:0 "Нам нужно служить армии, чтобы защитить нашего народа!"
 HOL_weapons:0 "Военная прибыль"
 HOL_weapons_desc:0 "Пусть индустрия оружия извлечет выгоду от растущего спроса на оружие"
 HOL_VaderLand:0 "Для людей и родины"
 HOL_VaderLand_desc:0 "Национализм не обязательно должен быть злым ..."
 HOL_Eupen:0 "Запросить Eupen"
 HOL_Eupen_desc:0 "В прошлом мы контролировали Eupen раньше ... давайте сделаем это еще раз, чтобы обеспечить мир между Бельгией и Германией."
 HOL_Enpower_democrats:0 "Enpower демократов"
 HOL_Enpower_democrats_desc:0 "Нейтральная сторона нашей страны имеет большую власть, мы должны показать миру, что мы готовы стоять и защищать свободу любой ценой!"
 HOL_Faction_Bel:0 "Реформа Грут Недерленд"
 HOL_Faction_Bel_desc:0 "Мы восстановим Нидерланды в это бывшая слава!Для максимальной прибыли, конечно ..."
 HOL_Faction_LUX:0 "Пригласить Люксембург"
 HOL_Faction_LUX_desc:0 "Они также когда -то были частью нашей великой республики, может быть, они хотят снова присоединиться."
 HOL_Colony_freedom:0 "Предоставить больше колониальной автономии"
 HOL_Colony_freedom_desc:0 "Как настоящие коммунисты, у нас не могут быть настоящие колонии ... но остальные не заметят ..."
HOL_Fate_of_Siam:0 "Судьба Сиама"
HOL_Fate_of_Siam_desc:0 ""
HOL_Claim_our_colies_america:0 "Претендовать на американские колонии"
