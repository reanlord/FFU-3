 # [Holland] Diplomatic Effort
 #=========================================================================
HOL_WW1_DIPLOMATIC_EFFORT:0 "Дипломатические усилия"
HOL_WW1_DIPLOMATIC_EFFORT_DESC:0 "Становится все труднее оставаться в середине дел в мире, в котором он стоит.Из вещей полностью. Хотя мы пока не можем ответить на этот вопрос, мы можем легко расширить наш корпус, чтобы иметь возможность выбрать один из этих вариантов"

Hol_WW1_SupportGermany:0 "Поддержка Германии"
Hol_WW1_SupportgerMany_desc:0 "С массовым промышленным сектором немецкой империи они, похоже, являются ясной ставкой, даже если они дипломатически изолированы. Показывая общественную поддержку немцам даже на несколько, не ключе Перемещение ближе к центральным державам"

Hol_WW1_SupportFrance:0 "Поддержка Франции"
HOL_WW1_SUPPORTFRANCE_DESC:0 "Хотя Франция не может конкурировать с Германией, у них гораздо больше друзей, и мы даже были бы еще одним. Поддержав Францию в нескольких предстоящих дипломатических проблемах, мы можем просто победить их"

Hol_WW1_SupportAustria:0 "Поддержка Австрии-Венгрия"
Hol_WW1_SupportAustria_DESC:0 "Старая империя Австрии-Венгрии жила, чтобы увидеть рост большинства основных наций на карте мира. Так что, конечно, если мы хотим стать более важной нацией, какая лучшая страна для поддержки?Это также поможет нам приблизиться к центральным державам"

HOL_WW1_SUPPORTRUSSIA:0 "Поддержка России"
HOL_WW1_SUPPORTRUSSIA_DESC:0 "Российская империя в довольно острого нуждается в международной помощи. Для нации, чей бывший лидер придумал термин больной человек России», они не могут быть особенно здоровыми. Наша поддержка, если ничто иное, поможет, поможетОни держатся достаточно долго, чтобы сделать что -то решительное"

HOL_WW1_MILEARTION_RESERVE:0 "Военный запас"
HOL_WW1_MILEARTION_RESEREVE_DESC:0 "Война может легко прийти к нашим границам в любой момент, и поэтому мы должны быть готовы к худшему. Военный заповедник свободно обученных призывников будет иметь небольшую истинную ценность в случае войны, но этоВпечатляемые молодые люди, получающие вкус армейской жизни, могут очень легко убедить их присоединиться к реальной вещи"
HOL_WW1_EMBARGO_GERMANY:0 "Санкция Германия"
HOL_WW1_EMBARGO_GERMANY_DESC:0 "Незаконные атаки Германии - это оскорбление свободной торговли! Хотя санкция немного дальше откроет нас от нейтралитета, это заставит нас намного труднее использовать торговцы Германской империи".

HOL_WW1_EMBARGO_FRANCE:0 "Санкция Франция"
HOL_WW1_EMBARGO_FRANCE_DESC:0 "Дипломатическая интрига Франции и задним числом непростительны! Хотя санкция заставит нас появиться и действовать гораздо менее нейтрально в военной ситуации, вряд ли будет спираль во что -то плохое, и, что более важно, обеспечит Францию не может воспользоваться нами!"

Hol_WW1_SellWeapons:0 "Продает оружие"
HOL_WW1_SellWeapons_DESC:0 "Хотя напряжение мира- это самое высокое, что было когда-либо, даже у этого штормового моллюска серебряная подкладка. Поскольку мы не заинтересованы в присоединении к бою, мы можем легко вытащить наше оружие и проекты оружия- даже к обеим сторонамКонфликт, если мы хотим- и сделаем убийство из несчастья других. Их вина за начало войны"

Hol_WW1_Joingermany:0 "Присоединяйтесь к центральным силам"
Hol_ww1_joingermany_desc:0 "Центральные силы долгое время были другом для нашей страны и отчаянно нуждаютсяЕсли бы мы так, но мы могли бы превратить приливы к решающей победе с их стороны"

HOL_WW1_JOINFRANCE:0 "Присоединяйтесь к Entente"
HOL_WW1_JOINFRANCE_DESC:0 "Антента в настоящее время, кажется, находится в лучшем положении, чтобы выиграть войну, и мы не хотели бы, чтобы нас поймали, пропустив мирную конференцию, как только они это сделают. Вступление в Аненту обязательно втянет нас в войну, что может запуститькатастрофически, но, по крайней мере, у нас будут союзники, чтобы помочь, верно? "

HOL_WW1_WAR_EFFORT:0 "Военные усилия"
HOL_WW1_WAR_EFFORT_DESC:0 "С миром в его нынешнем состоянии мы не можем позволить другим нациям пройти через наши военные. Расширяя нашу промышленную базу, мы можем убедиться, что у нас будет достаточно оружия и снарядов, чтобы выйти на первое место"

HOL_WW1_equip_fra:0 "Entente Arms Delivers"
HOL_WW1_equip_fra_desc:0 ""

HOL_WW1_equip_ger:0 "Центральные власти по доставке рук"
HOL_WW1_equip_ger_desc:0 ""

Hol_WW1_Grants:0 "гранты"
HOL_WW1_GRANTS_DESC:0 "Кредит деньги на Antente, чтобы помочь им в их военных усилиях"
HOL_WW1_VOLUNTEERS:0 "Добровольцы"
HOL_WW1_VOLUNTEERS_DESC:0 "Мы можем помочь нашим союзникам в их военных усилиях, отправив им войска"

Hol_colony_war:0 "Подготовка к войне"
Hol_colony_war_desc:0 ""
HOL_WW1_ENG_EXCHANGE_PLAN:0 "Голландский план английского обмена"
HOL_WW1_ENG_EXCHANGE_PLAN_DESC:0 "Обмен исследования с английским"

Hol_war_reserach:0 "War Research"
Hol_war_reserach_desc:0 "Соблюдайте борьбу и станьте сильнее в процессе"

Hol_war_studies:0 "Военные исследования"
HOL_WAR_STUDIES_DESC:0 "Изучите борьбу, происходящие вокруг наших границ"

HOL_ACCES_TODOS:0 "Откройте границы"
HOL_ACCES_TODOS_DESC:0 "Война приближается очень близко. Мы должны открыть наши границы, чтобы спасти столько человеческих жизней, пока они пытаются обойти нас"

HOL_WW1_WAR_FANATICS:0 "Военные фанатики"
HOL_WW1_WAR_FANATICS_DESC:0 "Есть энтузиасты войны, которые хотели бы сражаться с нашими друзьями"

HOL_WW1_GER_EXCHANGE_PLAN:0 "Голландский Германский план обмена"
HOL_WW1_GER_EXCHANGE_PLAN_DESC:0 "Обмен исследования с немцами"

HOL_GERMAN_ACCESS:0 "Немецкий военный доступ"
HOL_GERMAN_ACCESS_DESC:0 "План военного обмена с Германией был бы очень прибыльным…".

Hol_neutrality_focus:0 "Нейтралитет фокус"
Hol_neutrality_focus_DESC:0 "Хотя другие могут утверждать, что для того, чтобы отвлечься и мудрость, нужно взять на себя сторону в глобальном конфликте, мы знаем, что для отказа требуется больше"

Hol_hostile_diplo:0 "Враждебная нейтралитет"
HOL_HOSTILE_DIPLO_DESC:0 "Если мы собираемся быть нейтральными, должны быть готовы защищать наш нейтралитет"

Hol_friendly_diplo:0 "дружественный нейтралитет"
Hol_friendly_diplo_desc:0 "Если мы хотим остаться в стороне от войн, мы должны подружиться с боевыми вечеринками"

Hol_armed_neu:0 "Вооруженный нейтралитет"
HOL_ARMED_NEU_DESC:0 "Мы должны быть подготовлены в любом случае войны"

Hol_Home_Defence:0 "Домашняя защита"
Hol_home_defence_desc:0 "Это вышло из -под контроля, мы больше не можем оставаться нейтральными"

Hol_Interventionism_focus:0 "Фокус интервенционизма"
Hol_Interventionism_focus_desc:0 "Мы ценим свободу всех людей, не только наших собственных граждан. Если предотвращение тирании означает войну, то пусть будет так"

Hol_deterrence:0 "сдерживание"
Hol_deterrence_desc:0 "Стоя в одиночестве, мы редко получаем пользу от войны. К счастью, мы знаем, что лучшая защита настолько известна, что вам никогда не придется использовать его"

Hol_volunteer_Corps:0 "Корпус добровольцев"
Hol_volunteer_Corps_DESC:0 ", заставляя наших людей умереть за идеалы свободы, было бы упражнением в иронии, но установление средств для тех, кто хочет помогать людям за границей, нет".

Hol_foreign_exeditions:0 ""
Hol_foreign_exeditions_desc:0 ". С нашими врагами, готовыми к вмешательству в отдаленные конфликты от имени их идеалов, мы должны быть готовы сделать то же самое для наших"

Hol_why_we_fight:0 "Почему мы боремся"
HOL_WHY_WE_FIGHT_DESC:0 "Мир становится все более небезопасным. Наши люди должны видеть, что злодеяния совершаются теми, кто жаждет власти. Настало время сплотить людей к нашему делу и гарантировать, что все готовы бороться за нашу свободу"

Hol_technology_sharing:0 "Обмен технологиями"
Hol_technology_Sharing_DESC:0 ". Поделив технологические достижения с нашими союзниками, вся наша фракция сможет более эффективно проводить исследования и разработки военного времени"
