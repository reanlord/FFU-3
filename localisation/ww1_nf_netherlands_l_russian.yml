HOL_Faction_Bel_COM:0 "Реформа Грут Недерленд "
HOL_Faction_Bel_COM_desc:0 "Мы восстановим Нидерланды в это бывшая слава!Для максимальной прибыли, конечно, ... "
HOL_FACTION_LUX_COM:0 "Пригласить люксембург"
HOL_FACTION_LUX_COM_DESC:0 "Они также когда -то были частью нашей великой республики, может быть, они хотят присоединиться снова".
HOL_WW1_COLONY_EFFORT_1:0 "
HOL_WW1_COLONY_EFFORT_1_DESC:0 "Мы должны сосредоточиться на более развитии в наших колониях".
