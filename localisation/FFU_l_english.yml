  ww1_bulgaria.2.d:0 "Dear Bulgarian compatriots, It is with deep sorrow that we share the challenging news our homeland has faced setbacks in the first Balkan War against the Ottoman Empire. Although the circumstances are difficult, let us remember that history is made of trials and resilience. Together, as a strong nation, we can overcome these challenges and strive for a brighter future. Let us continue to work towards peace and unity, standing together in this delicate time. Let us remain proud of our history and work together to build a more promising future."
