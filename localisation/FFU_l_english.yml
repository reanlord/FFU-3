  offensiveevents.14.t:0 "Ottoman offensive on the Suez Canal"
  offensiveevents.14.d:0 "Plunge into the heart of an epic struggle as the Ottoman Empire launches a ruthless offensive against the British Empire. In the burning sands of the Middle East, armies clash in a battle where honour, strategy and the will to power collide. Fragile alliances are formed, treachery is brewing, and the fate of entire nations teeters on a knife-edge. In this war of the titans, who will emerge victorious and who will buckle under the weight of history? Get ready for a saga of courage, sacrifice and determination, as two empires battle for supremacy in a world in turmoil."
  offensiveevents.14.a:0 "In Ottoman Turkey, kebab removes you!"

