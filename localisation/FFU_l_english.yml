  TUR_offensive1:0 "Suez Offensive"
  offensiveevents.55.t:0 "Austria launches its invasion plan of Serbia"
  offensiveevents.55.d:0 "In the gears of history, a nation stands against an empire. The drums of war echo as Austria-Hungary deploys its forces to invade Serbia. In the heart of the Balkans, an imminent conflict threatens to shake the fragile balance of an entire region. Dive into the heart of the action, where bravery and strategy intertwine in a battle for supremacy. History awaits, what will be your role in this epic tale?"
  offensiveevents.55.a:0 "Ok"

  offensiveevents.51.t:0 "The Austrian counteroffensive"
  offensiveevents.51.d:0 "As the tides of war shift, Russia finds itself facing the full force of the Austro-Hungarian counteroffensive. With relentless determination, Austria-Hungary strikes back, pushing deep into Russian territory. In the vast expanse of the Eastern Front, a fierce struggle unfolds, shaping the fate of nations. Will Russia withstand this onslaught, or will the might of the Dual Monarchy prove too formidable to overcome? The battlefield awaits, where every decision will echo through the annals of history."
  offensiveevents.51.a:0 "Ok"
