l_english:
  ffu.2.t: "FFU FAQ / BASICS "
  ffu.2.d: " Welcome to FFU, here is a FAQ. THE USA IS NOT PLAYABLE. \n 1. Agadir Crisis is just an event on Jan 1 1912, that gives 150pp and unlocks Partial Mob. \n 2. Great War starts July 28 1914 \n 3. Belgium is attacked on August 11 1914. \n 4. Ottomans and Senusiyya join October 26 1914. \n 6. Bulgaria and Italy join January 1 1915. \n 6. Greece joins March 1 1915. Romania joins May 1 1915, if the player chooses to join. Greece and Romania will stay neutral if they are AI. \n 7. Trench Warfare and Trench Doctrines start December 1 1914. \n 8. Trenches can't be built on the Eastern Front (not including the Caucasus). \n 9. You can get rid of the top bar resources in the trade tab. "
  faq_event_generic.1.t:0 "What's new?"
  faq_event_generic.1.desc:0 "We have greatly changed the meta, and it is strongly recommended to take a look at equipment and division statistics. Forget divisions with only artillery; it is really not recommended. Feel free to find new alternatives to break through the enemy line; they do exist, don't worry. \n By the way it's 30 Width divisions, all terrain is 90 width."
  faq_event_generic.1.a:0 "So i have to use my brain now ?? Booooooriiing"
  faq_event_generic.2.t:0 "Explain me the Offensive"
  faq_event_generic.2.desc:0 "For now, France, Germany, and Russia have 'Offensives' that grant temporary bonuses to energize the fronts for a period of about 3 months. This triggers music for everyone, alerting the start of an offensive. It used to be in focuses, but now they are in decisions, and it's important not to forget to click on them!"
  faq_event_generic.2.a:0 "Yeah more stats i like this mmhh..."
  faq_event_generic.3.t:0 "Explain me The State of Levant"
  faq_event_generic.3.desc:0 "Well, if you've ever played PMFU or Oaks, it's pretty straightforward to understand because we adopted their system, which works very well for the Pacific, with some changes to the statistics. If you haven't played these mods yet, I recommend trying them in multiplayer; they're really cool (especially Oaks ^^). \nThe State of Levant is an idea given upon the Ottoman's entry into war. It aims to make the Egyptian front more significant. The important states for the Entente are §RKuwait§!, §RCairo§!, §RMarsa Matruh§!, and §RAswan§!. For the Ottomans they are §RPalestine§!, §RDamascus§!, §RBaghdad§!, and §RKonstantinyye§!. \nEach conquered English state grants bonuses to the Central Powers. Conversely, each conquered Ottoman state inflicts penalties on the Central Powers. Every state is worth §B2.5%§! to research speed, factory output, and dockyard output. \nIf the Ottomans lose all of the states without taking any of the Entente's, they will white peace and can send volunteers to the Central Powers."
  faq_event_generic.3.a:0 "Okay scammer."
  faq_generic:0 "FAQ about meta"
  faq_generic2:0 "FAQ about Offensive"
  faq_generic3:0 "FAQ about State of levant"
  faq_decisions:0 "FAQ"
  faq_generic4:0 "FAQ about the U.S.A."
  faq_event_generic.4.t:0 "Explain U.S. participation"
  faq_event_generic.4.desc:0 "We did not want to impose the punishment of the United States in World War I, which involves observing throughout the game until one side surrenders before their entry into the war. Instead, Russia automatically swaps to the USA when the Russian Civil War occurs. This is all done through events, no hotjoin needed.\nYou don't keep your stockpile, so make as much use of it as possible."
  faq_event_generic.4.a:0 "Got it."
  faq_generic5:0 "FAQ about Russia"
  faq_event_generic.5.t:0 "Explain me how to make the russian civil war happen"
  faq_event_generic.5.desc:0 "For now, the mechanic is to capture §RRiga§!, §RMinsk§!, §RKiev§!, and §ROdessa§! to trigger the Russian Civil War. As a Russian player, you desperately need to hold these positions. \n70 infantry divisions will spawn for each city you lose.. \nIf you are defeated, the country will change appearance and you continue playing as the USA, this happens automatically. You don't keep your stockpile, so make as much use of it as possible.\nIn order to prevent exploitation of the mechanic, Russia cannot send lend-lease."
  faq_event_generic.5.a:0 "A communist revolution? I really don't see how this could end badly"
  faq_generic6:0 "FAQ Basics"
  faq_serbia:0 "FAQ about Serbia"
  faq_event_generic.8.t:0 "Tell me how Serbia works now"
  faq_event_generic.8.desc:0 "Serbia gets a focus to move to Portugal (so you will NOT capitulate) and teleport the army to Tunisia.\nEvacuation to Portugal will also happen automatically if you lose the states of Serbia, Nis, and Morava.\n If you hold until November 1st, you'll receive 4 offmap mils, and 2 mils for each additional month.\nIf Serbia is not a player, the UK gets a decision for industrial compensation."
  faq_event_generic.8.a:0 "serbia greattst countrey"
  faq_poland:0 "FAQ about Poland"
  faq_event_generic.11.t:0 "Info about Poland"
  faq_event_generic.11.desc:0 "Poland has been added as a playable Central Powers minor. \n You receive plenty of free manpower from your focus tree, and can get much more by reclaiming part of your homeland. \n If Poland is annexed by decision at game start, certain Austrian focuses will give additional factories."
  faq_event_generic.11.a:0 "Got it."
  faq_balkan_wars:0 "FAQ about Balkan Wars"
  faq_event_generic.7.t:0 "Explain me the Balkan War"
  faq_event_generic.7.desc:0 "First Balkan War starts September 1st 1912. Bulgaria does not join the war. \n Balkan League needs to capture South Serbia, East Montenegro, Albania, Macedonia, Epirus, and Central Macedonia. Ottomans should try to hold any of these states until May 1913. The longer they hold, the more land will go to Bulgaria instead of Greece and Serbia. \n Everybody gets their cores once the war ends. \n For now, the Second Balkan War is just an event in August 1913, which transfers some land and gives some army XP to the Balkan Minors."
  faq_event_generic.7.a:0 "Ok."
  faq_entente:0 "Helpful Info for Entente"
  faq_event_generic.9.t:0 "Some helpful info for the Entente"
  faq_event_generic.9.desc:0 "The Entente are at a disadvantage in 1914 and early 1915, but get much stronger over time. Early on, they need to prevent the Central Powers from focusing down any one front. \n Belgium info: Belgium does not capitulate, due to holding the Channel Islands and the Isle of Man. \n Romania info: You can send volunteers to Russia once the Ottomans join. You can then join the war by decision, any time you want after 1 May 1915."
  faq_event_generic.9.a:0 "Got it."
  faq_central_powers:0 "Helpful Info for Central Powers"
  faq_event_generic.10.t:0 "Some helpful info for the Central Powers"
  faq_event_generic.10.desc:0 "The Central Powers have the advantage early on, but will be out-scaled over time if they can't keep up the offensive. \n Germany declares on Belgium and gets the Schlieffen Plan bonus for 70d on August 11th 1914."
  faq_event_generic.10.a:0 "Got it."
  faq_navy:0 "FAQ about navy"
  faq_event_generic.12.t:0 "Info about navy"
  faq_event_generic.12.desc:0 "Big changes are: CLs and CAs are useless, however CAs are awesome at giving shore bombardmend. BBs are dealing a bit more damage and DDs are now new main ship for the first line. DDs have increased HP and light attack, as well as piercing. \n This dictates new ideas at designing your main fleet. You should put there as much BBs as possible, preferably building dreadnoughts, and cover each of capital ship with two DDs. This composition should give you the most balanced fleet. \n However, some players may try to counter is using only capital ship strat with no first line and using according navy command spirit. To win this you should disengage and remove some DDs. This will fix your positioning. Also do not forget to build DDs with torpedoes as they may damage enemy capitals a lot when they will be left with no screens."
  faq_event_generic.12.a:0 "TL;DR."