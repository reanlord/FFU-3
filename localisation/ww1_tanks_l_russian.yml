l_russian:

 tank_unlocker1:0 "Проект Ранний танк"
 FRA_tank_unlocker1:0 "Проект Левавассер"
 
 tank_unlocker2:0 "Прототип танка"
 ENG_tank_unlocker2:0 "Маленький Вилли"
 RUS_tank_unlocker2:0 "Царский танк"

 tank_unlocker1_desc:0 "Некоторые из наших капитанов артиллерии предложили создать бронированный артиллерийский тягач для использования на поле боя. Несмотря на то, что подобный проект вряд ли будет реализован - или, если уж на то пошло, вряд ли вообще будет построен - это первый важный шаг к тому, чтобы подобные идеи однажды стали реальностью."

 tank_unlocker2_desc:0 "Идея бронированной артиллерийской машины не нова, но вот конструкция, способная ее реализовать, - вполне. Создание базового прототипа танка, скорее всего, не приведет к каким-либо прямым результатам на поле боя, но на его основе вполне может появиться более традиционная конструкция."

 TANK_UNLOCKER_SPECIAL:0 "Создание прототипа танка является необходимым условием для разработки обычных танков. Эта технология должна быть изучена до того, как вы сможете исследовать продвинутые танки."
 TANK_UNLOCKER_RESEARCHED:0 "Позволяет исследовать дополнительные танковые технологии"

