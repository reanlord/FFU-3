 ww1_armored_car_equipment_1:0 "Бронированный автомобиль I"
 ww1_armored_car_equipment_2:0 "Бронированный автомобиль II"
 ww1_armored_car_equipment_3:0 "Бронированный автомобиль III"
 ww1_armored_car_equipment_4:0 "Бронированный автомобиль IV"
 ww1_armored_car_equipment_5:0 "Бронированный автомобиль V"


 ww1_armored_car_equipment_1_desc:0 "Хотя автомобиль - это еще молодая технология, ее уже рассматривают для военных целей. Такая простая конструкция, как установка пулемета на один из этих новых автомобилей и прикрепление еще нескольких металлических деталей в качестве брони, может дать нам новое интересное оружие для использования в бою."

 ww1_armored_car_equipment_2_desc:0 "Броневик все еще способен развиваться. Разместив основной пулемет во вращающейся башне, мы сможем обеспечить защиту всех членов экипажа, повысив эффективность машины и ее практичность в бою."

 ww1_armored_car_equipment_3_desc:0 "Поскольку кавалерия играет все меньшую роль на поле боя, бронеавтомобили кажутся логичным способом выполнить ту же роль в более безопасной манере. Модернизация двигателя и подвески наших броневиков, чтобы увеличить их скорость и мобильность, может стать хорошим способом помочь им в этом."

 ww1_armored_car_equipment_4_desc:0 "С появлением на поле боя танков наши броневики могут показаться устаревшими, но эти более дешевые и простые в производстве модели все еще могут сослужить хорошую службу нашим военным. Небольшая модернизация брони этих машин, чтобы они могли хотя бы выдерживать небольшие удары, поможет сохранить их конкурентоспособность."

 ww1_armored_car_equipment_5_desc:0 "По мере развития танков мы не забываем следить за тем, чтобы наши бронеавтомобили тоже были современными. Добавление небольших пушек или, возможно, автопушек в качестве основного орудия этих машин сделает их более грозными на поле боя, но при этом мобильными и экономичными."


