 ww1_super_heavy_tank_equipment:0 "Early Super Heavy Tank"


 ww1_light_tank_equipment_1_desc:0 "Тяжелые танки - это все хорошо, но легкий, более мобильный танк, который мог бы идти в ногу с кавалерией, - это действительно интересное предложение, особенно если он использует вращающуюся башню. Хотя некоторые утверждают, что менее бронированный легкий танк будет менее эффективным, потенциал этой роли нельзя игнорировать."
 ww1_light_tank_equipment_b_desc:0 "Несмотря на то, что наши новые легкие танки превзошли все ожидания, они вооружены только пулеметами, что делает их неэффективными против вражеских укреплений или транспортных средств. Замена пулемета на пушку снизит противопехотный потенциал легкого танка, если только мы не найдем другое место для его установки, но сделает его более эффективной платформой для борьбы с транспортными средствами."
 ww1_light_tank_equipment_2_desc:0 "Если установить пулемет непосредственно рядом с пушкой на легком танке, что наши инженеры называют коаксиальным креплением, мы получим лучшее из двух миров - легкий танк, способный бороться с вражескими машинами и при этом эффективный против вражеской пехоты. Возможно, когда-нибудь это станет мировым стандартом?"

 ww1_heavy_tank_equipment_1_desc:0 "Разработка прототипа танка почти приблизила к реальности бронированную, вооруженную пушкой и протектором машину. Усовершенствование конструкции, главное из которых - сделать ее пригодной для массового производства и способной стабильно преодолевать траншеи, может дать нам боеспособную машину для прорыва вражеских линий."
 ww1_heavy_tank_equipment_2_desc:0 "Усовершенствования конструкции тяжелого танка необходимы для того, чтобы машина оставалась полезной в меняющейся боевой ситуации. Протекторы универсального типа и более раздельные двигатели необходимы для того, чтобы эти наземные корабли могли продолжать сражаться до конца, а улучшения в расположении орудий могут дать нам дополнительное преимущество"

 ww1_super_heavy_tank_equipment_desc:0 "Возможно, будущее танкового дизайна повторяет будущее кораблей. Если мы просто сделаем наши танки больше, лучше бронированными и добавим больше пушек, то, хотя они будут стоить намного дороже, они будут намного эффективнее в бою. Наши инженеры предупреждают, что в случае развития противотанковых технологий они превратятся в гигантские гробы, но каковы шансы на это?"

 ww1_light_tank_equipment_3_desc:0 "В последние годы гражданская автомобильная промышленность переживает бум, особенно в том, что касается мощности двигателей. Если мы оснастим наши легкие танки более мощными двигателями, мы сможем увеличить как скорость, так и грузоподъемность наших легких танков, что приведет к созданию более быстрых и хорошо вооруженных моделей."

 ww1_heavy_tank_equipment_3_desc:0 "Легкие танки могут иметь меньшее вооружение, но их башни оказываются огромным преимуществом в бою. Если мы установим эти вращающиеся башни на наши тяжелые танки, они сами смогут получить такое же преимущество, а также сохранить преимущества более тяжелой брони."








