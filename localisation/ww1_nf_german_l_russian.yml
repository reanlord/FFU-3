GER_ww1_war_effort:0 "Военные усилия"
GER_ww1_war_effort_desc:0 "" 

GER_ww1_triple_alliance:0 "Обновить тройной альянс "
GER_ww1_triple_alliance_desc:0 "Наш старый союз с Австро-Венгрией и Италией должен снова обновить, и, учитывая климат Европы, это сложный случай, чтобы утверждать, по крайней мере, не пытаясь сделать это.В частности, Италия, по -видимому, все меньше и менее посвящена этому альянсу с течением времени, и особое внимание должно быть уделено этой области, чтобы убедиться, что они не предают нас"

GER_ww1_secret_alliance_rom:0 "Секретный союз с Румынией "
GER_ww1_secret_alliance_rom_desc:0 "Румынии управляет немецкий, и далеким родственником королевской семьи не меньше.Из -за этого, если не что иное, они могут иметь долю в тройном альянсе, даже если не много, из -за их претензий на Австрию.Тем не менее, утомив их какое -то время может быть стратегически в нашу пользу, если война с Россией прорвалась"

GER_ww1_italy_ally:0 "Поддержите Италию"
GER_ww1_italy_ally_desc:0 "ачало дипломатического толчка для дальнейших связей с Италией ослабит нашу позицию с Австро-Венгрией, хотя это может быть цена, которую стоит заплатить за то, чтобы сохранить их, по крайней мере, немного более лояльными"

GER_ww1_back_austria:0 "Поддержка Австрии-Венгрии "
GER_ww1_back_austria_desc:0 "Начало дипломатического толчка для дальнейших связей с Австрии-Венгрией, будет оттолкнуть Италию до некоторой степени, но, возможно, они смогут учиться на уровне лояльности Австрии-Венгрии в этом случае"

GER_ww1_send_advisor:0 "Отправить немецких консультантов"
GER_ww1_send_advisor_desc:0 "емецкие консультанты, особенно в армии, будут тепло получены как Италией, так и австрийской-вентральной, и в дальнейшем наши отношения с обеими странами, а также будут стоить Германии мало, но найти мужчин, достойных задачи и вывести их в поезд"

GER_ww1_turkey_friend:0 "Подружиться с османами"
GER_ww1_turkey_friend_desc:0 "Османская империя в отчаянии нуждается в большем количестве друзей, и, как и так, мы тоже. Хотя их военные были потрясены некоторыми недавними поражениями звука, наша соседка Франция уже оправилась от гораздо худшего, так что что останавливаетсяих?"

GER_ww1_zimmermann_telegram:0 "Отправить телеграмму Zimmermann"
GER_ww1_zimmermann_telegram_desc:0 "Мексика, как бы нестабильная, может стать ключом к тому, чтобы удержать США от войны. Если мы сформируем защитный союз с Мексикой, США будут вынуждены дважды подумать о том, чтобы объявить войну с соседом по соседствуЧтобы бороться с. Конечно, мы выглядели бы невероятно плохо, если бы телеграмма была перехвачена, особенно если она была неправильно перевозилась и преувеличена"

GER_ww1_baghdad:0 "Берлин-Багдадская железная дорога "
GER_ww1_baghdad_desc:0 "Запланированная железная дорога Берлин-Багдад-это амбициозный железнодорожный проект, стремящийся соединить немецкую столицу с османскими сердцами, где лежит хороший кусок османской нефти."

GER_asienkorps:0 "Кислотный корпус"
GER_asienkorps_desc:0 ""

GER_ww1_assert_position_west:0 "Утверждать немецкую позицию на Западе "
GER_ww1_assert_position_west_desc:0 "Западный фронт - мрачное место для центральных держав.Франция и Великобритания связаны с нами и нашими интересами, что наносит ущерб будущему Германии в Африке.Хуже того, Бельгия, кажется, больше не так готов позволить немецким войскам, чтобы раздавить французов, которых они больше не видят в угрозе.Мы должны максимально использовать плохую ситуацию, если мы хотим оставаться на плаву как великая сила"

GER_ww1_anti_fr:0 "Анти-французская политика"
GER_ww1_anti_fr_desc:0 " незапамятных времен немцы и французы были врагами. Если мы действуем вокруг этой реальности, это откроет новые и интересные варианты, чтобы справиться с ними в будущем"

GER_ww1_anti_uk:0 "Анти-британская политика"
GER_ww1_anti_uk_desc:0 " то время как англо-германская дружба была хорошей, пока она продолжалась, Германия и Великобритания пришли друг другу в последние годы, и, похоже, это не будет изменено в ближайшее время.Некоторые варианты, чтобы обойти их дипломатично".

GER_ww1_support_boer:0 "Подкреплять Deutsch-Südwestafrika"
GER_ww1_support_boer_desc:0 "SWA, также известная как Намибия, является одной из самых важных колоний в Германии. Убедиться, что она защищается в атаке, может помочь в том, чтобы помочь военным усилиям нашей страны, если дело доходит до этого, и это потребует лишь незначительные инвестиции"

GER_ww1_support_boer_war:0 "Восстание фермера"
GER_ww1_support_boer_war_desc:0 "уры Южной Африки все еще только недавно завоеваны и еще не приспосабливаются к британскому правлению. Если мы поставляем и обучим некоторых буров, которые ищут независимость от Великобритании, они могут подняться против южноафриканских чиновников, даваяНам редкое преимущество в в основном контролируемом регионе мира"

GER_ww1_agadir_crisis:0 "Агадирский кризис"
GER_ww1_agadir_crisis_desc:0 " повстанцами, организующими в Марокко, и достаточным интересом Германии в регионе, чтобы провозглашать их актуальными, мы можем поддержать их восстание против французского правительства, чтобы попытаться захватить Марокко для себя. Хотя эта цель сама по себе маловероятно, мы ничего не можем, если ничего не можем, если ничего не можем, если ничего не можем, если ничего не можем, если ничего не можем, если ничего не можем, если ничего не можем, если ничего не можем, если ничего не можем, если ничего не сможем, если ничего не можем, если ничего не сможем, если ничего не можем, если ничего не можем, если ничего не сможем, если ничего не сможем, если ничего не сможем, если ничего не сможем.Иначе, встряхните Францию для более разумной территории, если мы достаточно их грилем, хотя это может привести Великобританию еще ближе к ним"

GER_ww1_assert_position_east:0 "Утвердить позицию немецкого языка на востоке"
GER_ww1_assert_position_east_desc:0 "Позиция центральных держав на Востоке- это то же самое ослабление России и строить гегемонию в регионе. Поскольку война с Россией, в частности, кажется почти неизбежной из-за балканской ситуации, это эффективный курс действийВозьми, хотя и подведет Францию и Россию ближе, что может оказаться проблемой"

GER_ww1_anti_ru:0 "Антируссийская политика"
GER_ww1_anti_ru_desc:0 "оссия не наша друга, и, возможно, никогда не будет снова, из -за их экстравагантных заявлений не только на дружескую территорию, но и на нашу собственную польсную землю. Принятие этой истины может привести к некоторым новым способам справиться с ними в будуще".

GER_ww1_anti_serb:0 "Антисербийская политика"
GER_ww1_anti_serb_desc:0 "ербцы- это крысы, которые продали бы свою собственную мать, если бы это означало получить только провинцию из австрийской Боснии. Если мы столкнулись с ними, как они действительно являются противоположным состоянием для США- мы можем подготовиться к тому, чтобы выступить против них в будущем."

GER_ww1_bulgaria_puppet:0 "Марионетка Болгария"
GER_ww1_bulgaria_puppet_desc:0 "Болгария доказала с помощью своих слабых выступлений на балканских войнах, что она не имеет истинного использования как союзник. Обеспечение соблюдения куколного государства над ними может оттолкнуть некоторых посторонних, но каково это?другие".

GER_ww1_bulgaria_friend:0 "Подружиться с Болгарией"
GER_ww1_bulgaria_friend_desc:0 "Болгария может многое получить в войне против Сербии, и еще два из наших потенциальных врагов в Греции и Румынии. Если мы обещаем им претендовать на Македонию и Фракию, которую Австрия-Венгрия даже не имеет никакого желания оспаривать их,Они могли присоединиться к нам, открыв второй фронт, чтобы облегчить наши перетянутые силы, и дать нам еще один источник столь необходимой рабочей силы"

GER_ww1_ready_country:0 "Приготовьтесь к войне"
GER_ww1_ready_country_desc:0 "Генералы беспокоятся о борьбе. Они начинают верить, что силы Антента планируют что -то ужасное против нас. Мы должны подготовиться к бою, и мы должны быть готовы сделать упреждающий удар, иначе мы не можем выжитьПриступающий конфликт ".

GER_ww1_strengthen_kaiser:0 "Усилить кайзер"
GER_ww1_strengthen_kaiser_desc:0 "Правило Его Величества над Германией должно быть неспособным. Даже в бурные времена он - лучший человек, на который можно вернуться, и может поддержать нашу империю через густые и тонкие. Следовательно, любая мера, которую мы можем принять, от конституционных поправок до новых законов вРейхстаг, должен быть взят, чтобы сохранить Вильгельм мощным"

GER_ww1_weaken_kaiser:0 "Ослабьте кайзер"
GER_ww1_weaken_kaiser_desc:0 "ильгельм II доказал себе ... интересный лидер, если не сказать больше. Возможно, чтобы убедиться, что он не нанесен дальнейшего повреждения немецкой империи, было бы лучше ограничить его контроль над царством и делегировать большую власть более способнымРуки."

GER_ww1_restructure_ostafrika:0 "Реструктуризация немецко-восточной Африки"
GER_ww1_restructure_ostafrika_desc:0 "осточная Африка - это наша главная колония, но это не значит, что мы не можем сделать больше в этом районе. Расширяя роль и административные полномочия колониального правительства, они могут эффективно создавать регион дальше для нас".

GER_ww1_train_ostafrika:0 "Сила защиты развертывания"
GER_ww1_train_ostafrika_desc:0 "Наши колониальные администраторы сообщили о большом количестве местных восточноафриканских мужчин, которые являются безработными бойцами, стремящиеся служить в немецкой армии. Если мы сможем найти некоторых добровольцев, чтобы обучать и возглавить эту группу, мы могли бы, если ничто другое, противостоять противБританские силы в этом районе как можно дольше ".

GER_ww1_war_with_france:0 "План Шлиффена 1915 года"
GER_ww1_war_with_france_desc:0 "аконец -то пришло время! Франция будет атакована через Бельгию, и мы въезжаем в Париж, а они не мудрее! Наша защита на востоке будет тусклой, но кого это волнует?! Это должно работать! Это будет работать, как это пожелает Кайзер!"

GER_ww1_polnische_wehrmacht:0 "Польский wehrmacht"
GER_ww1_polnische_wehrmacht_desc:0 "сли мы обещаем полюса своим собственным государственным государством после войны, возможно, жители нашей части Польши будут более склонны присоединиться к действию. Заканчиваем ли мы территорией или нет, конечно, необходимо решить еще.Но сейчас мы можем насладиться притоком трудоспособных людей, не задумываясь о последствиях".

GER_ww1_hol_militaryaccess:0 "просите Нидерланды для военного доступа"
GER_ww1_hol_militaryaccess_desc:0 "чевидно, что война в Бельгии будет более благоприятной для нас, если мы сможем пройти через Нидерланды, что также даст нам легкое место для отступления на случай, если битва пошла плохо. Переговоры должны оказаться успешными, пока мы не надеемся»Случайно называют свою страну просто "олландией». Они ненавидят это"

GER_ww1_den_militaryaccess:0 "ила Дании занять позицию"
GER_ww1_den_militaryaccess_desc:0 "олее 10 000 датских граждан Германии из Северного Шлезвига сражались в немецкой армии из-за поражения Дании и аннексии Шлезвиг-Гольштейна со стороны Пруссии во второй войне Шлезвига в 1864 году".


GER_ww1_friend_sweden:0 "ригласить Швецию в центральные державы "
GER_ww1_friend_sweden_desc:0 "отя это длинный выстрел, Швеция может быть убедит присоединиться к Центральным державам, если мы пообещаем восстановить их удержание на Финляндии. Хотя для них вполне вероятно, что они примут такое предложение, нам нужны все друзья, которые мы можем получить, иМы ничего не теряем, по крайней мере, спрашивая, верно? "

GER_ww1_finnish_civil_war:0 "оддержка белых в финской гражданской войне"
GER_ww1_finnish_civil_war_desc:0 "Гражданская война между красными, возглавляемая социал-демократической партией и белыми, проводимой несоциалистической, консервативной сенатом, началась в Финляндии. Красные охранники контролируют города и промышленные центры Южной Финляндии. Белые гвардии.Контроль сельской центральной и северной Финляндии"

