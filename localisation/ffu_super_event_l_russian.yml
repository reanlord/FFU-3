 super_event_picture_1:0 "FFU_ww1_start"
 super_event_title_1:0 "Великая война "
 super_event_text_1:0 " Этот новый участок ... они тоже пошли бы.Они были «войсками», которые собирались быть «брошены», «люди» в более широком плане какого-то генерала, «восстановления» и вскоре станут «жертвами».Они также были Spud, Snow, Skeeter, Blue, Tommo.\ n- Дэвид Малуф"
 super_event_button_text_1:0 "Страх."

 super_event_picture_2:0 "FFU_balkan_war"
 super_event_title_2:0 "Балканская война"
 super_event_text_2:0 "Правительства Турции не проявили интереса к своим обязанностям по отношению к своим гражданам и придерживались все жалобы и предложения.Все вышло из -под контроля, что никто не был удовлетворен ситуацией в Турции в Европе.Это стало невыносимым для сербов, греков и албанцев.\ n- король Петра I из Сербии"
 super_event_button_text_2:0 "Poodgekerg ждал, чтобы взорваться."

 super_event_picture_3:0 "FFU_russian_civil_war"
 super_event_title_3:0 "Русская гражданская война"
 super_event_text_3:0 "Капитализм одержал победу во всем мире, но этот триумф является лишь прелюдией к триумфу труда над капиталом.\ n- vladimir lenin"
 super_event_button_text_3:0 "This is bad."

 super_event_picture_4:0 "FFU_franz_joseph_dead"
 super_event_title_4:0 "Франц Джозеф я проходит "
 super_event_text_4:0 "Я последний правитель Старого Света.\ n- Kaiser Franz Joseph I"
 super_event_button_text_4:0 "Прощай, наш любимый."

 super_event_picture_5:0 "FFU_jihad"
 super_event_title_5:0 "Mehmed V объявляет джихад"
 super_event_text_5:0 "Было бы религиозной обязанностью для всех мусульман во всех странах, будь то молодая или старая, пехота или кавалерия, прибегать к джихаду со всеми их имуществами и жизнями, как того требует Коранический стих Энфиру, если султан Ислам объявляет войнуи называет все население под оружием, когда вражеское нападение на ислам и исламские страны вымогаются и разграблены, а исламские люди порабощены?Ответить, это было бы.\ n-sultan mehmed v"
 super_event_button_text_5:0 "Они ответят?"
 
 super_event_picture_6:0 "FFU_black_sea_raid"
 super_event_title_6:0 "Черный морской рейд"
 super_event_text_6:0 "Вы сильно ошибаетесь.У нас эта страна абсолютно под контролем.У меня нет желания менять вину на наших подчиненных, и я полностью готов взять на себя ответственность за все, что произошло.\ n- Исмаил Энвер Паша"
 super_event_button_text_6:0 "Еще одна нация присоединяется."
 
 super_event_picture_6:0 "FFU_black_sea_raid"
 super_event_title_6:0 "Черный морской рейд"
 super_event_text_6:0 "Вы сильно ошибаетесь.У нас эта страна абсолютно под контролем.У меня нет желания менять вину на наших подчиненных, и я полностью готов взять на себя ответственность за все, что произошло.\ n- Исмаил Энвер Паша"
 super_event_button_text_6:0 "Еще одна нация присоединяется."
 
 super_event_picture_7:0 "FFU_schlieffen_plan"
 super_event_title_7:0 "План Шлиффена"
 super_event_text_7:0 "Бельгия - это нация, а не дорога.\ n- король Альберт I"
 super_event_button_text_7:0 "Держите маленькую Бельгию."
 
 super_event_picture_8:0 "FFU_christmas_truce"
 super_event_title_8:0 "Рождественское перемирие"
 super_event_text_8:0 "В канун Рождества в полдень огонь полностью прекратился - на обеих фронтах.Конечно, было необычно, что противоположная сторона также прекратила огонь.Затем пришел мой офицер, контролирующий часовых и сказал «Ожидаете ли вы неожиданную атаку?Потому что это очень необычно ситуация ». Я сказал:« Нет, я так не думаю.Но в любом случае все не бодрствуют, никто не спит, а часовые все еще дежутся.Так что я думаю, что все в порядке.\ n- Британская частная мармадуке Уолтинтон"
 super_event_button_text_8:0 "Немногомира."