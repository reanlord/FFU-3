 first_balkan_war:0 "First Balkan War"
 first_balkan_war_desc:0 "The war will be over if §4Greece§! and §1Serbia§! take\n§RMacedonia§! - §RCentral Macedonia§! - §REpirus§! - §RAlbania§! - §RSouth Serbia§! - §REaster montenegro§! or average victory mission is over so it will be a humiliating victory\n\nIn case of §8Very quick victory§!\n§1Serbia will take:§! §RSouth Serbia§! - §RMacedonia§! - §REast Macedonia§!\n§4Grece will take§!: §REpirus§! - §RCentral Macedonia§! - §RThrace§! - §RCentral Thrace§! - §REast Rumenia§!\n§GBulgaria will take:§! - §REdrine§!\n\nIn case of §8Quick victory§!\n§1Serbia will take:§! §RSouth Serbia§! - §RMacedonia§! - §REast Macedonia§!\n§4Grece will take:§! §REpirus§! - §RCentral Macedonia§! - §RThrace§!\n§GBulgaria will take:§! §RCentral Thrace§! - §REast Rumenia§! - §REdrine§!\n\nIn case of §8Average victory§!\n§1Serbia will take:§! §RSouth Serbia§! - §RMacedonia§!\n§4Grece will take:§! §REpirus§! - §RCentral Macedonia§!\n§GBulgaria will take:§! §RCentral Thrace§! - §REast Rumenia§! - §REdrine§! - §RThrace§! - §REast Macedonia§!\n\nIn case of §8Humiliating  victory§!\n§1Serbia will take:§! §RSouth Serbia§!\n§4Grece will take:§! §REpirus§!\n§GBulgaria will take:§! §RCentral Thrace§! - §REast Rumenia§! - §REdrine§! - §RThrace§! - §REast Macedonia§! - §RMacedonia§! - §RCentral Macedonia§R"
