 stateofthelevent.1.t:0 "State of the Levant"
 stateofthelevent.1.d:0 "Faced with mounting pressure and a perceived threat to its territorial integrity, the Ottoman Empire makes the strategic decision to enter the war alongside the Central Powers. This alliance, forged in the crucible of the complex diplomacy of the time, has the potential to radically alter the dynamics on the Eastern Front of the global conflict."
 stateofthelevent.1.a:0 "To war !"
 stateofthelevent.2.t:0 "The Ottoman Empire Capitulates"
 stateofthelevent.2.d:0 "The former superpower of the Levant and the muslim world has now been shattered by the new hegemonic powers of western Europe."
 stateofthelevent.2.a:0 "Shall peace rains over the Levant"
 stateofthelevent.3.t:0 "Arab tribes revolt"
 stateofthelevent.3.d:0 "After the defeats of our Empire, the arab tribes seeks independance under an unified arab state. They started by attacking our garrisons over Mecca and are now spreading all over the peninsula."
 stateofthelevent.3.a:0 "We can't let that happen"
 offensiveevents.80.t:0 "Austrian Invasion"
 offensiveevents.80.d:0 "On June 28, 1914, in Sarajevo, a young Serbian nationalist from Bosnia, Gavrilo Princip, assassinated the heir to the Austro-Hungarian throne, Archduke Franz Ferdinand, and his wife, the Duchess of Hohenberg. In response to the assassination, Austria-Hungary issued an ultimatum to the Kingdom of Serbia, in coordination with its German ally. As one of Austria-Hungary's demands was deemed unacceptable by the Serbs, Austria-Hungary declared war on Serbia. What could have been just another Balkan conflict escalated into a world war due to the intricate web of alliances among the major European powers, each leading empires that spanned multiple continents."
 offensiveevents.80.a:0 "We will fight bravely"*
 offensiveevents.81.t:0 "Further resistance"
 offensiveevents.81.d:0 "We managed to hold the austrians for now. We do not fear them and we will keep holding."
 offensiveevents.81.a:0 "Pursue the defence"
