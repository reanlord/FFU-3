 ENG_ww1_naval_effort:0 "Усилить королевский флот"
 ENG_ww1_naval_effort_desc:0 "Tоролевский флот Соединенного Королевства - самый большой и сильный флот в мире, насчитывающий столько же кораблей, сколько два следующих флота вместе взятых. Это не случайно - поскольку наша основная территория находится на острове, ее необходимо поддерживать, чтобы выжить в случае иностранного вторжения. Дальнейшие инвестиции в эту операцию могут привести только к хорошему."

