 Stormtroopers:0 "Штурмовики"
 Stormtroopers_desc:0 "Штурмовики были специализированными солдатами немецкой армии в Первой мировой войне. В последние годы войны Stoßtruppen ("ударные войска" или "войска толчка") были обучены тактике проникновения - части усовершенствованного немцами метода атаки на вражеские траншеи. Люди, обученные этим методам, были известны в Германии как штурмовики."
 sniper:0 "Снайперская рота"
 sniper_desc:0 "Отряды снайперов наносят огромный урон на дистанциях, аналогичных артиллерийским."
 flamethrower:0 "Огнеметная компания"
 flamethrower_desc:0 "Отряды огнеметчиков взрывают вражеские форты и траншеи."
 wardog:0 "Псы войны"
 wardog_desc:0 "Псы войны, которых враги называют "адскими гончими", помогают своему хозяину, где бы он ни находился."
 jaeger:0 "Егеря"
 jaeger_desc:0 "Специализированная легкая пехота, которая хорошо сражается в лесах и болотах."
