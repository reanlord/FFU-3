ww1_infantry2_equip:0 "Новый пехотный шлем"

ww1_infantry2_equip_desc:0 "Шляпы и кожаные кепки, которые были положены нашей пехоте, уже просто не подходят для современной войны, а попытки просто укрепить эти виды головных уборов не увенчались успехом. Приняв на вооружение новый шлем, сделанный из стали, мы, конечно, не сможем остановить пулю с постоянством, но нашим солдатам будет гораздо легче избежать случайных травм головы."


ww1_ambulance1:0 "Конная скорая помощь"
ww1_ambulance1_desc:0 "С появлением в нашей армии современных конных повозок мы смогли стандартизировать машину скорой помощи, чтобы быстро вывезти раненых с линии фронта и доставить их на лечение. Конечно, ехать придется по ухабам, и условия в этих повозках будут не самыми приятными, но это гораздо лучше, чем лечить раны посреди артиллерийской воронки."
ww1_ambulance2:0 "Моторизованная скорая помощь"
ww1_ambulance2_desc:0 "Замена конных повозок скорой помощи на автомобили позволит нам гораздо быстрее эвакуировать войска из боя, что поможет нам спасти жизни, когда время играет решающую роль. Улучшенные лошадиные силы также позволят ездить более плавно и эффективнее перевозить припасы, что еще больше увеличит отдачу от потерь."

ww1_oil1:0 "Добыча нефти"
ww1_oil1_desc:0 "Нефть и ее применение известны с конца XIX века, и, к сожалению, большинство наших возможностей по добыче нефти остались прежними. Модернизация наших нефтяных скважин позволит значительно увеличить добычу этого ценного вещества."
ww1_oil2:0 "Улучшенное бурение нефтяных скважин"
ww1_oil2_desc:0 "Нефть неуловима - она прячется под землей, где ее никто не видит. Поэтому нам крайне необходимо разрабатывать более эффективные способы ее обнаружения. Совершенствуя возможности бурения нефтяных скважин, мы сможем находить и, следовательно, добывать больше нефти вблизи существующих запасов."
ww1_oil3:0 "Обучение нефтяников"
ww1_oil3_desc:0 "С учетом последних достижений в области инструментов для поиска и добычи нефти мы не можем допустить, чтобы наши работники стали причиной отставания наших усилий. Установив стандарты обучения для работников нефтяных месторождений как в частном, так и в государственном секторе, мы сможем сделать так, чтобы меньше нефти пропадало зря, что еще больше укрепит наши новообретенные запасы черного золота."

ww1_bergiusprocess:0 "Процесс Бергиуса"
ww1_bergiusprocess_desc:0 "Процесс Бергиуса - это метод получения жидких углеводородов для использования в качестве синтетического топлива путем гидрогенизации высоколетучего битуминозного угля при высокой температуре и давлении."

ww1_tools3:0 "Современные ручные инструменты"
ww1_tools3_desc:0 "Даже старый фараон Менес был знаком с молотком и гвоздем, но современная промышленность позволяет нам производить больше, более совершенных и стандартизированных инструментов, что повышает производительность труда в наших мастерских и на предприятиях по всему миру - до тех пор, пока они могут найти этот проклятый 8-миллиметровый ключ..."


ww1_fortification1:0 "Работы Вобана по обороне"
ww1_fortification1_desc:0 "Кажется, что строительство укреплений не имеет смысла, и в какой-то степени так оно и есть. Однако для получения серьезной пользы от фортов важны их эффективное проектирование и расположение, а "Труды Вобана", несмотря на то что были опубликованы сотни лет назад, актуальны и по сей день. Изучение этого вопроса позволит строить более совершенные укрепления."

ww1_fortification2:0 "Рытье траншеи"
ww1_fortification2_desc:0 "Форты сами по себе хороши, но в условиях современной траншейной войны их интеграция в существующие системы траншей была бы еще лучше. Строительство небольших фортов, соединенных с траншеями, не только обеспечит нам превосходство в крепости, но и даст войскам гарнизона гораздо более легкий путь к отступлению в случае необходимости."

ww1_fortification3:0 "Железобетон"
ww1_fortification3_desc:0 "Даже вещество, из которого мы строим свои укрепления, еще можно улучшить. Усиление бетона приведет к созданию более устойчивых и прочных укреплений, менее уязвимых для вражеских артиллерийских ударов."

ww1_fortification3b:0 "Оборонительный бункер I"
ww1_fortification3b_desc:0 "Форты сами по себе являются хорошей защитой, но когда линия траншей продвигается вверх, на их строительство не остается ни места, ни времени. Бункеры, которые меньше по размеру и строятся гораздо быстрее, могут помочь нашим оборонительным линиям в укрепленных секторах оставаться в безопасности."

ww1_fortification5:0 "Оборонительный бункер II"
ww1_fortification5_desc:0 "Форты сами по себе являются хорошей защитой, но когда линия траншей продвигается вверх, на их строительство не остается ни места, ни времени. Бункеры, которые меньше по размеру и строятся гораздо быстрее, могут помочь нашим оборонительным линиям в укрепленных секторах оставаться в безопасности."

ww1_fortification6:0 "Оборонительный бункер III"
ww1_fortification6_desc:0 "Форты сами по себе являются хорошей защитой, но когда линия траншей продвигается вверх, на их строительство не остается ни места, ни времени. Бункеры, которые меньше по размеру и строятся гораздо быстрее, могут помочь нашим оборонительным линиям в укрепленных секторах оставаться в безопасности."

ww1_fortification4:0 "Поддержка зенитных орудий"
ww1_fortification4_desc:0 "Появление самолетов создает новую, довольно сложную проблему, с которой приходится сталкиваться при строительстве линий укреплений. Построить крепость вокруг падающей бомбы гораздо сложнее, чем, скажем, вокруг артиллерийского снаряда. Поэтому необходимо установить зенитные орудия, чтобы поддержать наши форты и сохранить их обороноспособность даже в условиях современной войны."




ww1_medicine1:0 "Новые хирургические инструменты"
ww1_medicine1_desc:0 "Эпоха, когда хирургия сводилась к костоправам и выпивке, слава богу, закончилась. Новые инструменты, такие как компас Хиртца, и новые методики для существующих инструментов, такие как внутривенное переливание крови, должны помочь спасти нескольких наших парней на поле боя."

ww1_medicine2:0 "Военная медицина"
ww1_medicine2_desc:0 "Пули - не единственная смертоносная сила в бою. Хорошо известно, что мрачный налогоплательщик смерти берет с солдат свою долю, особенно в застойной окопной войне. Обеспечение массового производства витаминов, антибиотиков и других химических лекарств - и, конечно, обеспечение того, чтобы все они действовали по назначению, - приведет к гораздо меньшему числу легко предотвратимых потерь среди наших солдат."

ww1_medicine3:0 "Усилия по стерилизации"
ww1_medicine3_desc:0 "Нет, не волнуйтесь, мы не начинаем национальную кампанию по вазектомии. Часть ужаса войны - это грязь образ хирурга, погруженного в пациента с чужой кровью на руках, привычен, но нехорош. Обеспечение надлежащих санитарных мер для наших медиков может помешать им приносить больше вреда, чем пользы."

ww1_medicine4:0 "Кампания по вакцинации"
ww1_medicine4_desc:0 "Никому не нравится делать прививку, но на поле боя вакцинация от распространенных заболеваний может спасти вам жизнь - ведь ни один больной солдат не будет хорошо сражаться. Хотя вакцинация еще не до конца изучена, мы знаем о ней достаточно, чтобы понять, что она имеет прямые положительные преимущества - а кто может устоять перед экономией живой силы?"

ww1_medicine5:0 "Модернизация больницы"
ww1_medicine5_desc:0 "Хотя наши фельдшеры сейчас все в порядке, мы не должны забывать о наших настоящих госпиталях за линиями фронта. Обеспечение этих людей всем необходимым для борьбы со всеми возможными болезнями, от шоковых состояний до ран от газа, и даже, возможно, выполнение реконструктивной хирургии или других смелых новых методик, приведет к еще большему числу выживших после близкого столкновения на передовой."



hoi4tgw_decryption:0 "Модернизация больницы"
hoi4tgw_decryption_desc:0 "Расшифровка - это обратное действие, другими словами, переход от неразборчивого шифротекста обратно к открытому тексту."

hoi4tgw_encryption:0 "Шифрование - Криптография"
hoi4tgw_encryption_desc:0 "До наших дней криптография относилась почти исключительно к шифрованию, которое представляет собой процесс преобразования обычной информации в неразборчивый текст."

