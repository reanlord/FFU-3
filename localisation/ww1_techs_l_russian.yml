NAVAL_TITLE_MINES:0 "ВОЙНА НА ШАХТЕ"

basic_naval_mines:0 "Контактная шахта"
basic_naval_mines_desc:0 "Простая плавающая бомба, закрепленная на морском дне. Мина взрывается при соприкосновении с кораблем."

improved_naval_mines:0 "Магнитная шахта"
improved_naval_mines_desc:0 "Эта сложная мина взрывается, когда обнаруживает изменения в магнитном поле, вызванные проплывающим мимо кораблем."

advanced_naval_mines:0 "Акустическая шахта"
advanced_naval_mines_desc:0 "Этот тип морских мин детонирует, когда его датчики обнаруживают шум близлежащего корабля."

modern_naval_mines:0 "Шахта под давлением"
modern_naval_mines_desc:0 "Эта высокотехнологичная мина обнаруживает небольшие изменения давления воды, вызванные движущимся рядом кораблем."

degaussing:0 "Размагничивание"
degaussing_desc:0 "Установив мощные электромагнитные катушки, можно значительно уменьшить магический след корабля, сделав его гораздо менее уязвимым для магнитных мин."

submarine_mine_laying:0 "Подводная лодка-миноносец"
submarine_mine_laying_desc:0 "Установив специальное оборудование для удержания и выпуска мин, специально сконструированная подводная лодка может устанавливать мины, находясь под водой и, надеемся, оставаясь незамеченной."

improved_submarine_mine_laying:0 "Установка торпедно-трубных мин"
improved_submarine_mine_laying_desc:0 "Переделка мин для установки в торпедные аппараты позволяет любой подводной лодке стать миноносцем, хотя и в ущерб количеству носимых торпед."

airdrop_mines:0 "Aerial Minelaying"
airdrop_mines_desc:0 "By fitting the mines with a small parachute, they can be safely dropped from airplanes, allowing quick and efficient creation of minefields."

airsweep_mines:0 "Aerial Minesweeping"
airsweep_mines_desc:0 "Airplanes can be fitted with special equipment to detect and safely detonate naval mines from the air."

naval_mines:0 "Технологии противоминной борьбы"

concentrated_industry_category:0 "Технологии концентрированной промышленности"

dispersed_industry_category:0 "Технологии рассредоточенной промышленности"

