early_ship_hull_carrier:0 "Переоборудование палуб"

early_ship_hull_carrier_short:0 "Переоборудование палуб"

early_ship_hull_carrier_desc:0 "Переоборудование старых корпусов позволяет проводить дешевые эксперименты с морской авиацией, чтобы получить опыт строительства и эксплуатации авианосцев. Эти корабли будут менее мощными, чем специально построенный авианосец, но их гораздо быстрее создать."

